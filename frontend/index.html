<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="index.title">박준우 — 개인 소개</title>
  <meta name="description" content="박준우의 개인 소개 페이지" data-i18n-attr="content:index.desc">
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="frame">
  <header class="site-header">
    <h1 data-i18n="index.h1">박준우를 소개합니다</h1>
    <div class="header-right">
      <nav aria-label="페이지 이동" data-i18n-attr="aria-label:nav.aria">
        <a href="index.html" aria-current="page" data-i18n="nav.home">소개</a>
        <a href="demo.html" data-i18n="nav.demo">API 연동 실습</a>
      </nav>
      <div class="controls">
        <button id="theme-btn" type="button"><span class="ico" aria-hidden="true"></span><span class="lbl"></span></button>
        <button id="lang-btn" type="button" data-i18n="lang.other" data-i18n-attr="aria-label:lang.aria">EN</button>
      </div>
    </div>
  </header>

  <!--
    한 화면에 담기는 3 x 2 타일 틀. 내용은 아직 비어 있다.
    - 타일 식별자: viewpoint · strategy · profile · reports · issues · media (좌상단부터 가로 순서)
    - 각 타일의 본문은 <div class="tile-body" data-tile="식별자"> 안에 채운다.
    - 나중에 DB 데이터를 불러오는 경우에도 data-tile 요소를 렌더링 대상으로 쓴다.
    - 제목·문구는 한국어는 여기, English 는 js/i18n.js 의 tile.<식별자>.* 키에 둔다.
  -->
  <main class="tiles">

    <section class="tile" id="tile-viewpoint" aria-labelledby="tile-viewpoint-title">
      <header class="tile-head"><h2 id="tile-viewpoint-title" data-i18n="tile.viewpoint.title">매크로 및 금리 전망</h2></header>
      <div class="tile-body" data-tile="viewpoint"><p class="tile-placeholder" data-i18n="tile.placeholder">내용 준비 중</p></div>
    </section>

    <section class="tile" id="tile-strategy" aria-labelledby="tile-strategy-title">
      <header class="tile-head"><h2 id="tile-strategy-title" data-i18n="tile.strategy.title">투자 전략 히스토리</h2></header>
      <div class="tile-body" data-tile="strategy"><p class="tile-placeholder" data-i18n="tile.placeholder">내용 준비 중</p></div>
    </section>

    <section class="tile" id="tile-profile" aria-labelledby="tile-profile-title">
      <header class="tile-head"><h2 id="tile-profile-title" data-i18n="tile.profile.title">프로필</h2></header>
      <div class="tile-body" data-tile="profile"><p class="tile-placeholder" data-i18n="tile.placeholder">내용 준비 중</p></div>
    </section>

    <section class="tile" id="tile-reports" aria-labelledby="tile-reports-title">
      <header class="tile-head"><h2 id="tile-reports-title" data-i18n="tile.reports.title">정기 보고서</h2></header>
      <div class="tile-body" data-tile="reports"><p class="tile-placeholder" data-i18n="tile.placeholder">내용 준비 중</p></div>
    </section>

    <section class="tile" id="tile-issues" aria-labelledby="tile-issues-title">
      <header class="tile-head"><h2 id="tile-issues-title" data-i18n="tile.issues.title">이슈 보고서</h2></header>
      <div class="tile-body" data-tile="issues"><p class="tile-placeholder" data-i18n="tile.placeholder">내용 준비 중</p></div>
    </section>

    <section class="tile" id="tile-media" aria-labelledby="tile-media-title">
      <header class="tile-head"><h2 id="tile-media-title" data-i18n="tile.media.title">언론/방송</h2></header>
      <div class="tile-body" data-tile="media"><p class="tile-placeholder" data-i18n="tile.placeholder">내용 준비 중</p></div>
    </section>

  </main>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
